name: Bug report
description: Report a reproducible AI Workflow Bridge defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do **not** paste API keys, cookies, session tokens, bot tokens, private keys, or private conversation content.
  - type: input
    id: version
    attributes:
      label: Bridge version
      placeholder: "0.2.1"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Web LLM provider
      options: [ChatGPT, Claude, Gemini, DeepSeek, Grok, Perplexity, Mistral, Copilot, Z.ai / GLM, Meta AI, Poe, Qwen, Kimi, Other / not provider-specific]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Redact private paths and data where possible.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted Mission Log / diagnostics
      render: text
