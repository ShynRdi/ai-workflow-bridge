name: Feature request
description: Propose a product or workflow improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety / account-risk considerations
      description: Explain whether this changes permissions, automation rate, shell execution, login/session handling, or provider behavior.
    validations:
      required: true
