name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q native_host tests
      - name: Test
        run: python -m pytest

  extension:
    name: Extension and public hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate public tree
        run: python3 scripts/check_public_hygiene.py
      - name: Validate manifest JSON
        run: python3 -c 'import json; json.load(open("extension/manifest.json", encoding="utf-8"))'
      - name: Check JavaScript syntax
        run: for f in extension/*.js; do node --check "$f"; done
      - name: Check shell syntax
        run: bash -n install_native_host.sh native_host/launcher.sh scripts/publish_to_github.sh
      - name: Build extension package
        run: python3 scripts/package_extension.py
      - uses: actions/upload-artifact@v4
        with:
          name: ai-workflow-bridge-extension
          path: dist/*.zip
          if-no-files-found: error
